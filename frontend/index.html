<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- 主题引导：必须同步、且早于下方样式表，否则会先按 classic 渲染再跳 glass（FOUC）。
         取值 ?theme= > localStorage > 不写属性（= classic 兜底）。
         详细规则与异常处理见 src/composables/useTheme.js。 -->
    <script>
      (function () {
        try {
          var KEY = 'mzg_theme'
          var theme = null
          try {
            var m = /[?&]theme=(classic|glass)(?:&|$)/.exec(window.location.search)
            if (m) theme = m[1]
          } catch (e) {}
          if (!theme) {
            try {
              var saved = window.localStorage.getItem(KEY)
              if (saved === 'classic' || saved === 'glass') theme = saved
            } catch (e) {}
          }
          if (theme) document.documentElement.setAttribute('data-theme', theme)
        } catch (e) {
          /* 静默退到 classic：什么都不做即可 */
        }

        /* 生产护栏：降级判定。也必须在这里做 —— 放到组件里会让降级本身
           造成一次闪烁（先按满效果渲染、再突然变素），比不降级更糟。 */
        try {
          var fx = false
          /* QA 覆盖：?fx=full 强制满效果、?fx=reduced 强制降级。
             存在的理由和 ?theme= 一样 —— 视觉回归要在**满效果**下取基线，
             而跑 CI 的机器常常核数很少（本机就是 2 核），
             启发式会一律判成低端，于是基线记录的全是降级态的外观。
             优先级最高，且不写入任何存储。 */
          var fxOverride = null
          try {
            var fm = /[?&]fx=(full|reduced)(?:&|$)/.exec(window.location.search)
            if (fm) fxOverride = fm[1]
          } catch (e) {}
          if (fxOverride) {
            if (fxOverride === 'reduced') document.documentElement.setAttribute('data-fx', 'reduced')
            document.documentElement.setAttribute('data-fx-override', fxOverride)
            return
          }
          try {
            if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) fx = true
            if (window.matchMedia('(prefers-contrast: more)').matches) fx = true
          } catch (e) {}
          if (!fx) {
            /* 低端设备**启发式**（见 assets/styles/fx.css 的说明）：
               deviceMemory 只有 Chromium 系支持，读不到时只看 CPU 核数。
               只做减负不做禁用 —— 判错的最坏结果是「好设备少了一点模糊」，
               而不是「差设备直接崩」，方向选错代价小，启发式才敢用。 */
            var cores = navigator.hardwareConcurrency
            var mem = navigator.deviceMemory
            var lowEnd =
              (typeof cores === 'number' && cores > 0 && cores <= 4) ||
              (typeof mem === 'number' && mem > 0 && mem <= 4)
            if (lowEnd) fx = true
          }
          if (fx) document.documentElement.setAttribute('data-fx', 'reduced')
        } catch (e) {
          /* 判定失败就不降级：满效果是可接受的默认 */
        }
      })()
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 品牌图标（设计交付 logo/favicon.svg） -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iOS 不支持 SVG 的 apple-touch-icon，必须用 PNG -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#E8635C" />

    <title>喵掌柜 · 摄影写真预约</title>
    <meta name="description" content="一站式摄影写真预约平台，浏览工作室、挑选时段、在线付定金。" />

    <!-- 微信等平台的分享卡片（设计交付 share/share-card，已按 1200×630 输出） -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="喵掌柜 · 摄影写真预约" />
    <meta property="og:description" content="浏览工作室、挑选时段、在线付定金。" />
    <meta property="og:image" content="/share-card.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="app"></div>

    <!-- 启动闪屏：主 JS 包约 350KB(gzip)，首次加载时首屏会有数秒空白。
         这里先渲染品牌形象，Vue 挂载时整个 #splash 会被替换掉。
         图片复用 public/apple-touch-icon.png（源自设计交付 ip/mascot-head），零额外体积。 -->
    <div id="splash" aria-hidden="true">
      <img src="/apple-touch-icon.png" alt="" width="96" height="96" />
      <span>喵掌柜</span>
    </div>
    <style>
      #splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 12px;
        background: #F9F8F6;
        font: 600 20px/1 Inter, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
        color: #4A4642; letter-spacing: .08em;
        transition: opacity .25s ease;
      }
      #splash img { width: 96px; height: 96px; }
      #splash.is-hidden { opacity: 0; pointer-events: none; }
      @media (prefers-reduced-motion: reduce) { #splash { transition: none; } }
    </style>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
